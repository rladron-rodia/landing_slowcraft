# Render Blueprint — provisioning declarativo
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: slowcraft-db
    databaseName: slowcraft
    user: slowcraft
    plan: free          # 90 días en plan free
    region: oregon

services:
  - type: web
    name: slowcraft-api
    runtime: node
    plan: free          # se duerme tras 15 min sin tráfico (cold start ~30s)
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: slowcraft-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "https://rladron-rodia.github.io,https://slowcraft.ai,https://www.slowcraft.ai"
      # Los siguientes son secrets — los configurás en el dashboard de Render
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      # Admin (Fase 2)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        sync: false
