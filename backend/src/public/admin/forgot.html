<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slowcraft · Recuperar contraseña</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="login-shell">
    <div class="login-card">
      <header class="login-header">
        <a href="/admin/login" class="brand" aria-label="Slowcraft">
          <span class="brand-symbol" aria-hidden="true"></span>
          <span class="brand-text">Slowcraft</span>
          <span class="brand-eyebrow">Admin</span>
        </a>
        <h1>Recuperar <em>contraseña.</em></h1>
        <p style="margin-top:12px;font-size:14px;color:var(--piedra);line-height:1.5;">
          Te enviamos un link para crear una nueva contraseña. Expira en 30 minutos.
        </p>
      </header>

      <div class="form-error" id="error" role="alert"></div>
      <div class="success-block" id="success" style="display:none;" role="status">
        Si el email coincide con un admin, te llegará un link en breve. Revisá también spam.
      </div>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" type="email" id="email" name="email" autocomplete="username" required>
        </div>

        <button type="submit" class="btn btn-block" id="submit-btn">
          <span id="btn-label">Enviar link de recuperación</span>
        </button>
      </form>

      <p class="login-aux">
        <a href="/admin/login">← Volver al login</a>
      </p>
    </div>
  </main>

  <script>
    const form = document.getElementById('forgot-form');
    const errBox = document.getElementById('error');
    const successBox = document.getElementById('success');
    const btn = document.getElementById('submit-btn');
    const btnLabel = document.getElementById('btn-label');

    function showError (msg) { errBox.textContent = msg; errBox.classList.add('is-visible'); }
    function clearError () { errBox.classList.remove('is-visible'); }
    function showSuccess () { successBox.style.display = 'block'; form.style.display = 'none'; }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const email = form.elements.email.value.trim();
      if (!email) { showError('Ingresá tu email.'); return; }

      btn.disabled = true;
      btnLabel.textContent = 'Enviando…';

      try {
        const res = await fetch('/api/admin/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        // El backend siempre responde 200 con respuesta genérica (no leakea si email existe)
        if (res.ok) {
          showSuccess();
        } else {
          const data = await res.json().catch(() => ({}));
          showError(data.error || 'Error inesperado. Intentá de nuevo en un rato.');
          btn.disabled = false;
          btnLabel.textContent = 'Enviar link de recuperación';
        }
      } catch (err) {
        showError('Error de red. Intentá de nuevo.');
        btn.disabled = false;
        btnLabel.textContent = 'Enviar link de recuperación';
      }
    });
  </script>
</body>
</html>
