<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slowcraft · Admin · Contenido</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="app-header">
    <a href="/admin/dashboard" class="brand" aria-label="Slowcraft Admin">
      <span class="brand-symbol" aria-hidden="true"></span>
      <span class="brand-text">Slowcraft</span>
      <span class="brand-eyebrow">Admin</span>
    </a>
    <div class="app-header-nav">
      <span class="user-email" id="user-email"></span>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Salir</button>
    </div>
  </header>

  <main class="app-main">
    <!-- Top-level nav (filtrado por rol vía JS) -->
    <nav class="app-tabs" aria-label="Secciones principales" id="app-tabs">
      <a href="/admin/dashboard"           data-tab="leads">Leads</a>
      <a href="#contenido/general"         data-tab="contenido"     data-top="contenido">Contenido</a>
      <a href="#formulario"                data-tab="formulario"    data-top="formulario">Formulario</a>
      <a href="#configuracion/analytics"   data-tab="configuracion" data-top="configuracion">Configuración</a>
      <a href="#analitica"                 data-tab="analitica"     data-top="analitica">Analítica</a>
      <a href="#usuarios"                  data-tab="usuarios"      data-top="usuarios">Usuarios</a>
    </nav>

    <h1 class="app-h1" id="page-title">Contenido <em>de la landing.</em></h1>
    <p class="app-subtitle" id="page-subtitle">Editá los textos en español e inglés.</p>

    <!-- Sub-nav (visible solo cuando la sección activa tiene sub-items) -->
    <nav class="content-subtabs" id="subtabs"></nav>

    <section class="content-pane" id="pane">
      <div class="state">Cargando…</div>
    </section>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="modal-overlay" id="modal-overlay"></div>
  <aside class="modal" id="modal" aria-hidden="true">
    <header class="modal-header">
      <h3 id="modal-title">—</h3>
      <button class="drawer-close" id="modal-close" aria-label="Cerrar">×</button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </aside>

  <script>
    // ============================================================
    // Slowcraft Admin · Routing 2 niveles
    //   #contenido/general | /programs | /servicios | /metodo
    //   #formulario
    //   #configuracion/analytics
    // ============================================================

    const ROUTES = {
      contenido: {
        title: 'Contenido', subtitle: 'Editá los textos por sección en español e inglés.',
        subs: [
          { key: 'general',   title: 'General' },
          { key: 'programs',  title: 'Programs' },
          { key: 'servicios', title: 'Servicios' },
          { key: 'metodo',    title: 'Método' }
        ],
        defaultSub: 'general'
      },
      formulario: {
        title: 'Formulario', subtitle: 'Sección CTA antes del formulario y campos del formulario.',
        subs: null
      },
      configuracion: {
        title: 'Configuración', subtitle: 'Ajustes globales del sitio.',
        subs: [
          { key: 'analytics', title: 'Analytics y GTM' },
          { key: 'whatsapp',  title: 'WhatsApp' },
          { key: 'social',    title: 'Redes sociales' }
        ],
        defaultSub: 'analytics'
      },
      analitica: {
        title: 'Analítica', subtitle: 'Métricas del sitio · datos desde Google Analytics 4.',
        subs: null
      },
      usuarios: {
        title: 'Usuarios', subtitle: 'Gestionar accesos al admin · invitar, asignar roles, desactivar.',
        subs: null
      }
    };

    // Permisos por rol (debe matchear ROLE_PERMISSIONS del backend)
    const ROLE_TABS = {
      master_admin: ['leads','contenido','formulario','configuracion','analitica','usuarios'],
      admin:        ['leads','contenido','formulario','configuracion','analitica'],
      viewer:       ['leads','contenido','formulario','configuracion','analitica'],
      content:      ['contenido'],
      commercial:   ['leads','formulario','analitica'],
      agente:       ['leads','analitica']
    };
    let currentUser = null;  // { email, role, permissions } — se setea en boot

    // Secciones que viven en "Contenido General"
    const CONTENT_SECTIONS = [
      { key: 'nav',           title: 'Navegación' },
      { key: 'hero',          title: 'Hero' },
      { key: 'tesis',         title: 'Tesis' },
      { key: 'metodo.head',   title: 'Método · Cabecera' },
      { key: 'servicios.head',title: 'Servicios · Cabecera' },
      { key: 'programs.head', title: 'Programs · Cabecera' },
      { key: 'principios',    title: 'Principios' },
      { key: 'sobre',         title: 'Sobre nosotros' },
      { key: 'footer',        title: 'Footer' }
    ];

    // ---------- API helpers ----------
    async function api (path, opts = {}) {
      const res = await fetch(path, {
        ...opts,
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) }
      });
      if (res.status === 401) { window.location.replace('/admin/login'); throw new Error('unauth'); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      return data;
    }

    function toast (msg, type = 'success', timeout = 4000) {
      const region = document.getElementById('toasts');
      const t = document.createElement('div');
      t.className = 'toast toast-' + type;
      t.textContent = msg;
      region.appendChild(t);
      requestAnimationFrame(() => t.classList.add('is-visible'));
      setTimeout(() => { t.classList.remove('is-visible'); setTimeout(() => t.remove(), 300); }, timeout);
    }

    function escapeHtml (s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function fmtAgo (iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      const mins = Math.floor((Date.now() - d.getTime()) / 60_000);
      if (mins < 1) return 'recién';
      if (mins < 60) return 'hace ' + mins + ' min';
      const h = Math.floor(mins / 60);
      if (h < 24) return 'hace ' + h + ' h';
      return d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' });
    }

    // ---------- Modal ----------
    function openModal (title, bodyHtml, actions) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      const actionsEl = document.getElementById('modal-actions');
      actionsEl.innerHTML = '';
      (actions || []).forEach(a => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-sm ' + (a.variant === 'secondary' ? 'btn-secondary' : a.variant === 'danger' ? 'btn-danger' : '');
        btn.textContent = a.label;
        btn.addEventListener('click', () => { a.onClick && a.onClick(btn); });
        actionsEl.appendChild(btn);
      });
      document.getElementById('modal-overlay').classList.add('is-open');
      document.getElementById('modal').classList.add('is-open');
    }
    function closeModal () {
      document.getElementById('modal-overlay').classList.remove('is-open');
      document.getElementById('modal').classList.remove('is-open');
    }
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-overlay').addEventListener('click', closeModal);

    // ============================================================
    // Routing
    // ============================================================
    function activeRoute () {
      const hash = (window.location.hash || '').replace('#', '');
      const [top, sub] = hash.split('/');
      const validTop = ROUTES[top] ? top : 'contenido';
      const route = ROUTES[validTop];
      const validSub = route.subs ? (route.subs.find(s => s.key === sub) ? sub : route.defaultSub) : null;
      return { top: validTop, sub: validSub, route };
    }

    function syncTopNav (top) {
      document.querySelectorAll('.app-tabs a[data-top]').forEach(a => {
        a.classList.toggle('is-active', a.dataset.top === top);
      });
    }

    function syncSubNav (route, currentSub) {
      const subtabs = document.getElementById('subtabs');
      if (!route.subs) { subtabs.innerHTML = ''; subtabs.style.display = 'none'; return; }
      subtabs.style.display = '';
      subtabs.innerHTML = route.subs.map(s => `
        <a href="#${escapeHtml(currentTop())}/${escapeHtml(s.key)}" class="${currentSub === s.key ? 'is-active' : ''}">${escapeHtml(s.title)}</a>
      `).join('');
    }

    function currentTop () { return activeRoute().top; }

    function syncTitle (route, sub) {
      document.getElementById('page-title').innerHTML = `${escapeHtml(route.title)}${sub ? ' <em>· ' + escapeHtml((route.subs.find(s => s.key === sub) || {}).title || '') + '.</em>' : ' <em>de la landing.</em>'}`;
      document.getElementById('page-subtitle').textContent = route.subtitle;
    }

    async function renderActive () {
      const { top, sub, route } = activeRoute();
      syncTopNav(top);
      syncSubNav(route, sub);
      syncTitle(route, sub);

      try {
        if (top === 'contenido') {
          if (sub === 'general')   return await renderContenidoGeneral();
          if (sub === 'programs')  return await renderCatalog('programs');
          if (sub === 'servicios') return await renderCatalog('servicios');
          if (sub === 'metodo')    return await renderCatalog('metodo');
        }
        if (top === 'formulario')   return await renderFormulario();
        if (top === 'configuracion') {
          if (sub === 'analytics') return await renderAnalytics();
          if (sub === 'whatsapp')  return await renderSimpleSettings('whatsapp', 'WhatsApp', 'Configurá el número (puede ser WhatsApp Business) y el mensaje pre-llenado del CTA "Contáctanos por WhatsApp" del formulario. Cuando esté configurado, el botón se transforma en un link wa.me que abre el chat. Para integrar un chatbot custom + IA en el futuro, ver el modo "chatbot" (próximamente).');
          if (sub === 'social')    return await renderSimpleSettings('social',  'Redes sociales', 'URLs de los perfiles. Si dejás vacío un campo, el link no aparece en el footer de la landing.');
        }
        if (top === 'analitica')    return await renderAnalitica();
        if (top === 'usuarios')     return await renderUsuarios();
      } catch (err) {
        document.getElementById('pane').innerHTML = `<div class="state"><h3>Error</h3>${escapeHtml(err.message)}</div>`;
      }
    }
    window.addEventListener('hashchange', renderActive);

    // ============================================================
    // CATALOG VIEW (programs / servicios / metodo)
    // ============================================================
    async function renderCatalog (catalogType) {
      const typeKey = catalogType === 'metodo' ? 'fase' : (catalogType === 'programs' ? 'program' : 'servicio');
      const data = await api(`/api/admin/catalog/${typeKey}`);
      const items = data.items || [];

      const isProgram = typeKey === 'program';
      const isServicio = typeKey === 'servicio';
      const itemsLabel = isProgram ? 'Módulos' : (isServicio ? 'Ítems' : null);
      const labelSingular = isProgram ? 'Programa' : (isServicio ? 'Servicio' : 'Fase');

      const cards = items.map(item => {
        const fields = item.fields || [];
        const titleField = fields.find(f => /\.h$/.test(f.i18n_key));
        const itemFields = fields.filter(f => /\.(m|li)\d+$/.test(f.i18n_key));

        const itemsListHtml = itemsLabel ? `
          <div class="catalog-items-block">
            <div class="catalog-items-head">
              <span class="catalog-items-label">${itemsLabel} (${itemFields.length})</span>
              <button class="btn btn-sm btn-ghost" data-action="add-item" data-section="${escapeHtml(item.section)}">+ Agregar ${itemsLabel === 'Módulos' ? 'módulo' : 'ítem'}</button>
            </div>
            <ul class="catalog-items-list">
              ${itemFields.map(f => `
                <li class="catalog-item-row">
                  <div class="catalog-item-vals">
                    <input data-edit-key="${escapeHtml(f.i18n_key)}" data-lang="es" value="${escapeHtml(f.value_es)}" placeholder="ES">
                    <input data-edit-key="${escapeHtml(f.i18n_key)}" data-lang="en" value="${escapeHtml(f.value_en)}" placeholder="EN">
                  </div>
                  <button class="btn-icon-danger" data-action="remove-item" data-key="${escapeHtml(f.i18n_key)}" title="Eliminar">×</button>
                </li>`).join('')}
              ${itemFields.length === 0 ? '<li class="catalog-empty">Sin ítems aún. Agregá el primero.</li>' : ''}
            </ul>
          </div>` : '';

        return `
          <article class="catalog-card" data-section="${escapeHtml(item.section)}">
            <header class="catalog-card-head">
              <div>
                <div class="catalog-card-meta">
                  <span class="catalog-card-num">${String(item.display_order).padStart(2, '0')}</span>
                  ${item.tag ? `<span class="catalog-card-tag">${escapeHtml(item.tag)}</span>` : ''}
                  <span class="catalog-card-section">${escapeHtml(item.section)}</span>
                </div>
                <h3 class="catalog-card-title">${escapeHtml(titleField ? titleField.value_es : '(sin título)')}</h3>
              </div>
              <div class="catalog-card-actions">
                <button class="btn btn-sm btn-secondary" data-action="clone-item" data-section="${escapeHtml(item.section)}" data-title="${escapeHtml(titleField ? titleField.value_es : item.section)}">⎘ Clonar</button>
                <button class="btn btn-sm btn-secondary" data-action="edit-meta" data-section="${escapeHtml(item.section)}" data-tag="${escapeHtml(item.tag || '')}" data-order="${item.display_order}">⚙ Meta</button>
                <button class="btn btn-sm btn-danger" data-action="delete-item" data-section="${escapeHtml(item.section)}" data-title="${escapeHtml(titleField ? titleField.value_es : item.section)}">🗑 Eliminar</button>
              </div>
            </header>

            <div class="catalog-card-body">
              ${fields.filter(f => !/\.(m|li)\d+$/.test(f.i18n_key)).map(f => `
                <div class="catalog-field">
                  <div class="catalog-field-label">${escapeHtml(f.field_label || f.i18n_key)} <span class="content-field-key">${escapeHtml(f.i18n_key)}</span></div>
                  <div class="catalog-field-grid">
                    <textarea data-edit-key="${escapeHtml(f.i18n_key)}" data-lang="es" rows="${f.value_es.length > 80 ? 3 : 1}" placeholder="ES">${escapeHtml(f.value_es)}</textarea>
                    <textarea data-edit-key="${escapeHtml(f.i18n_key)}" data-lang="en" rows="${f.value_en.length > 80 ? 3 : 1}" placeholder="EN">${escapeHtml(f.value_en)}</textarea>
                  </div>
                </div>
              `).join('')}
              ${itemsListHtml}
            </div>

            <footer class="catalog-card-foot">
              <span class="content-action-status">Editado ${fmtAgo(item.updated_at)}</span>
              <button class="btn btn-sm" data-action="save-card" data-section="${escapeHtml(item.section)}">Guardar cambios</button>
            </footer>
          </article>`;
      }).join('');

      document.getElementById('pane').innerHTML = `
        <div class="catalog-toolbar">
          <div>
            <p class="content-section-meta">${items.length} ${labelSingular.toLowerCase()}${items.length !== 1 ? 's' : ''}</p>
          </div>
          <button class="btn" id="add-catalog-item">+ Nuevo ${labelSingular.toLowerCase()}</button>
        </div>
        <div class="catalog-list">${cards || '<div class="state">Sin items. Agregá el primero.</div>'}</div>`;

      document.getElementById('add-catalog-item').addEventListener('click', () => promptCreateCatalog(typeKey));
      document.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', (e) => handleCatalogAction(e, typeKey));
      });
    }

    async function handleCatalogAction (e, typeKey) {
      const btn = e.currentTarget;
      const action = btn.dataset.action;
      if (action === 'delete-item') {
        const section = btn.dataset.section;
        const title = btn.dataset.title;
        if (!confirm(`¿Eliminar "${title}"? Esta acción no se puede deshacer.`)) return;
        try {
          await api(`/api/admin/catalog/section/${encodeURIComponent(section)}`, { method: 'DELETE' });
          toast('Eliminado ✓', 'success');
          renderActive();
        } catch (err) { toast('Error: ' + err.message, 'error'); }
      }
      else if (action === 'save-card') {
        const section = btn.dataset.section;
        const card = document.querySelector(`.catalog-card[data-section="${section}"]`);
        const inputs = card.querySelectorAll('[data-edit-key]');
        const grouped = {};
        inputs.forEach(i => {
          const k = i.dataset.editKey, lang = i.dataset.lang;
          if (!grouped[k]) grouped[k] = { i18n_key: k };
          grouped[k]['value_' + lang] = i.value;
        });
        const changes = Object.values(grouped);
        btn.disabled = true; btn.textContent = 'Guardando…';
        try {
          await api('/api/admin/content/bulk', { method: 'PATCH', body: JSON.stringify({ changes }) });
          toast('Guardado ✓', 'success');
          renderActive();
        } catch (err) {
          toast('Error: ' + err.message, 'error');
          btn.disabled = false; btn.textContent = 'Guardar cambios';
        }
      }
      else if (action === 'add-item') {
        const section = btn.dataset.section;
        try {
          await api(`/api/admin/catalog/section/${encodeURIComponent(section)}/items`, {
            method: 'POST', body: JSON.stringify({ value_es: '', value_en: '' })
          });
          toast('Ítem agregado', 'success');
          renderActive();
        } catch (err) { toast('Error: ' + err.message, 'error'); }
      }
      else if (action === 'remove-item') {
        const key = btn.dataset.key;
        if (!confirm('¿Eliminar este ítem?')) return;
        try {
          await api(`/api/admin/catalog/items/${encodeURIComponent(key)}`, { method: 'DELETE' });
          toast('Eliminado', 'success');
          renderActive();
        } catch (err) { toast('Error: ' + err.message, 'error'); }
      }
      else if (action === 'edit-meta') {
        promptEditMeta(btn.dataset.section, btn.dataset.tag, btn.dataset.order);
      }
      else if (action === 'clone-item') {
        const section = btn.dataset.section;
        const title = btn.dataset.title;
        if (!confirm(`¿Clonar "${title}"? Se creará una copia editable.`)) return;
        try {
          await api(`/api/admin/catalog/section/${encodeURIComponent(section)}/clone`, { method: 'POST' });
          toast('Clonado ✓', 'success');
          renderActive();
        } catch (err) { toast('Error: ' + err.message, 'error'); }
      }
    }

    function promptCreateCatalog (typeKey) {
      const labelSingular = typeKey === 'program' ? 'programa' : (typeKey === 'servicio' ? 'servicio' : 'fase');
      openModal(`Nuevo ${labelSingular}`, `
        <div class="field">
          <label class="label">Tag (opcional)</label>
          <input class="input" id="new-tag" placeholder="${typeKey === 'program' ? 'FOUNDATIONS' : typeKey === 'servicio' ? 'STRATEGY' : ''}">
        </div>
        <div class="field">
          <label class="label">Título inicial · ES</label>
          <input class="input" id="new-title-es" placeholder="Nombre del ${labelSingular}">
        </div>
        <div class="field">
          <label class="label">Título inicial · EN</label>
          <input class="input" id="new-title-en" placeholder="${labelSingular} name">
        </div>
      `, [
        { label: 'Cancelar', variant: 'secondary', onClick: closeModal },
        { label: 'Crear', onClick: async (b) => {
            b.disabled = true;
            try {
              await api(`/api/admin/catalog/${typeKey}`, {
                method: 'POST',
                body: JSON.stringify({
                  tag: document.getElementById('new-tag').value.trim() || null,
                  defaults_es: { h: document.getElementById('new-title-es').value.trim() },
                  defaults_en: { h: document.getElementById('new-title-en').value.trim() }
                })
              });
              toast('Creado ✓', 'success'); closeModal(); renderActive();
            } catch (err) { toast('Error: ' + err.message, 'error'); b.disabled = false; }
        }}
      ]);
    }

    function promptEditMeta (section, currentTag, currentOrder) {
      openModal(`Metadata · ${section}`, `
        <div class="field"><label class="label">Tag</label><input class="input" id="meta-tag" value="${escapeHtml(currentTag)}"></div>
        <div class="field"><label class="label">Orden</label><input class="input" type="number" id="meta-order" value="${currentOrder}" min="1"></div>
      `, [
        { label: 'Cancelar', variant: 'secondary', onClick: closeModal },
        { label: 'Guardar', onClick: async (b) => {
            b.disabled = true;
            try {
              await api(`/api/admin/catalog/section/${encodeURIComponent(section)}`, {
                method: 'PATCH',
                body: JSON.stringify({
                  tag: document.getElementById('meta-tag').value.trim() || null,
                  display_order: parseInt(document.getElementById('meta-order').value, 10) || 0
                })
              });
              toast('Metadata actualizada', 'success'); closeModal(); renderActive();
            } catch (err) { toast('Error: ' + err.message, 'error'); b.disabled = false; }
        }}
      ]);
    }

    // ============================================================
    // CONTENIDO GENERAL VIEW
    // ============================================================
    async function renderContenidoGeneral () {
      const data = await api('/api/admin/content');
      const sections = data.sections || {};

      const sidebarHtml = CONTENT_SECTIONS.map(s => {
        const has = !!sections[s.key];
        return `<li><button type="button" class="section-btn" data-content-section="${escapeHtml(s.key)}" ${!has ? 'disabled' : ''}>${escapeHtml(s.title)}</button></li>`;
      }).join('');

      document.getElementById('pane').innerHTML = `
        <div class="content-shell">
          <aside class="content-sidebar">
            <h4>Secciones</h4>
            <ul>${sidebarHtml}</ul>
          </aside>
          <section class="content-pane-inner" id="contenido-pane">
            <div class="state">Elegí una sección a la izquierda.</div>
          </section>
        </div>`;

      const dirty = {};
      document.querySelectorAll('button[data-content-section]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('button[data-content-section]').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          renderContenidoSection(btn.dataset.contentSection, sections, dirty);
        });
      });

      const firstAvail = CONTENT_SECTIONS.find(s => sections[s.key]);
      if (firstAvail) document.querySelector(`button[data-content-section="${firstAvail.key}"]`).click();
    }

    function renderContenidoSection (sectionKey, allSections, dirty) {
      const fields = allSections[sectionKey] || [];
      const meta = CONTENT_SECTIONS.find(s => s.key === sectionKey) || { title: sectionKey };

      const fieldsHtml = fields.map(f => {
        const dirtyVal = dirty[f.i18n_key];
        const valEs = dirtyVal ? dirtyVal.value_es : f.value_es;
        const valEn = dirtyVal ? dirtyVal.value_en : f.value_en;
        const isLong = (f.value_es && f.value_es.length > 60) || f.value_type === 'html';
        return `
          <div class="content-field ${dirtyVal ? 'is-dirty' : ''}" data-key="${escapeHtml(f.i18n_key)}">
            <div class="content-field-header">
              <span class="content-field-label">${escapeHtml(f.field_label || f.i18n_key)}</span>
              <span class="content-field-key">${escapeHtml(f.i18n_key)}</span>
              <span class="content-field-type ${f.value_type === 'html' ? 'is-html' : ''}">${f.value_type === 'html' ? 'HTML' : 'Texto'}</span>
            </div>
            <div class="content-field-grid">
              <div class="content-field-lang">
                <span class="content-field-lang-label">ES</span>
                ${isLong
                  ? `<textarea data-edit-key="${escapeHtml(f.i18n_key)}" data-lang="es" rows="${Math.min(6, Math.max(2, Math.ceil(valEs.length / 60)))}">${escapeHtml(valEs)}</textarea>`
                  : `<input type="text" data-edit-key="${escapeHtml(f.i18n_key)}" data-lang="es" value="${escapeHtml(valEs)}">`}
              </div>
              <div class="content-field-lang">
                <span class="content-field-lang-label">EN</span>
                ${isLong

        if (key === 'analytics.gtm_id') {
          if (!/^GTM-[A-Z0-9]+$/.test(v)) return { ok: false, msg: '⚠ Formato esperado: GTM-XXXXXXX (mayúsculas y números).' };
        }
        if (key === 'analytics.ga4_id') {
          if (!/^G-[A-Z0-9]+$/.test(v)) return { ok: false, msg: '⚠ Formato esperado: G-XXXXXXXXXX.' };
        }
        return { ok: true, msg: '✓ Formato válido.' };

    let __analiticaState = { period: 'week', weeks: 12, agent: '' };
    let __chartLeads = null, __chartMotivo = null, __chartStatus = null;

    async function loadChartJs () {
      if (window.Chart) return window.Chart;
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js';
        s.onload = () => resolve(window.Chart);
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    async function renderAnaliticaLeads () {
      await loadChartJs();
      const { period, weeks, agent } = __analiticaState;

      // Cargar todo en paralelo
      const qs = (extra) => {
        const p = new URLSearchParams();
        if (agent) p.set('agent', agent);
        Object.entries(extra || {}).forEach(([k, v]) => p.set(k, v));
        return p.toString() ? '?' + p.toString() : '';
      };
      const [summaryD, periodD, motivoD, statusD, agentsPerf, agentsList] = await Promise.all([
        api('/api/admin/analytics/summary' + qs()),
        api('/api/admin/analytics/leads-by-period' + qs({ period, weeks })),
        api('/api/admin/analytics/leads-by-motivo' + qs()),
        api('/api/admin/analytics/leads-by-status' + qs()),
        api('/api/admin/analytics/leads-per-agent'),
        api('/api/admin/analytics/agents')
      ]);

      // Render KPIs
      document.getElementById('an-total').textContent = summaryD.total;
      document.getElementById('an-last7').textContent = summaryD.last7;
      document.getElementById('an-last30').textContent = summaryD.last30;
      document.getElementById('an-conv').textContent = summaryD.conversionRate + '%';

      // Chart 1: leads por período
      const ctx1 = document.getElementById('chart-leads').getContext('2d');
      if (__chartLeads) __chartLeads.destroy();
      __chartLeads = new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: periodD.data.map(d => fmtPeriodLabel(d.period, period)),
          datasets: [{
            label: agent ? `Leads de ${agent}` : 'Total leads',
            data: periodD.data.map(d => d.total),
            backgroundColor: '#A8593D',
            borderRadius: 2
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
        }
      });

      // Chart 2: motivo (donut)
      const ctx2 = document.getElementById('chart-motivo').getContext('2d');
      if (__chartMotivo) __chartMotivo.destroy();
      const motivoLabels = { proyectos: 'Proyectos', informes: 'Informes', 'bolsa-de-trabajo': 'Bolsa de trabajo' };
      __chartMotivo = new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: motivoD.data.map(d => motivoLabels[d.motivo] || d.motivo),
          datasets: [{
            data: motivoD.data.map(d => d.total),
            backgroundColor: ['#3A4F41','#A8593D','#5C705F','#7A7570'],
            borderWidth: 0
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
      });

      // Chart 3: status (horizontal bar)
      const ctx3 = document.getElementById('chart-status').getContext('2d');

        { label: 'Cerrar', onClick: closeModal }
      ]);

      const linkInput = document.getElementById('copy-link');
      const copyBtn = document.getElementById('copy-btn');
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(linkInput.value);
          copyBtn.textContent = '✓ Copiado';
          setTimeout(() => { copyBtn.textContent = 'Copiar'; }, 2000);
        } catch {
          linkInput.select();
          document.execCommand('copy');
          copyBtn.textContent = '✓ Copiado';
          setTimeout(() => { copyBtn.textContent = 'Copiar'; }, 2000);
        }
      });
    }

    async function handleUserAction (ev) {
      const el = ev.currentTarget;
      const action = el.dataset.action;
      const id = el.dataset.userId;

      if (action === 'role-change') {
        try {
          await api(`/api/admin/users/${id}/role`, { method: 'PATCH', body: JSON.stringify({ role: el.value }) });
          toast('Rol actualizado', 'success');
        } catch (err) { toast('Error: ' + err.message, 'error'); renderActive(); }
      }
      else if (action === 'resend') {
        try {
          const res = await api(`/api/admin/users/${id}/resend-invitation`, { method: 'POST' });
          // Buscar el email del user en la fila
          const row = el.closest('tr');
          const userEmail = row ? row.querySelector('strong').textContent : 'usuario';
          showInvitationResult(userEmail, res.verifyUrl, res.emailStatus);
        } catch (err) { toast('Error: ' + err.message, 'error'); }
      }
      else if (action === 'toggle-active') {
        const newState = el.dataset.isActive !== 'true';
        try {
          await api(`/api/admin/users/${id}/active`, { method: 'PATCH', body: JSON.stringify({ is_active: newState }) });
          toast(newState ? 'Usuario activado' : 'Usuario desactivado', 'success');
          renderActive();
        } catch (err) { toast('Error: ' + err.message, 'error'); }
      }
      else if (action === 'delete-user') {
        if (!confirm(`¿Eliminar ${el.dataset.email}? Esta acción no se puede deshacer.`)) return;
        try {
          await api(`/api/admin/users/${id}`, { method: 'DELETE' });
          toast('Usuario eliminado', 'success');
          renderActive();
        } catch (err) { toast('Error: ' + err.message, 'error'); }
      }
    }

    // ============================================================
    // ROLE-BASED UI — filtra tabs visibles + read-only mode para viewer
    // ============================================================
    function applyRoleUI (user) {
      currentUser = user;
      const allowedTabs = ROLE_TABS[user.role] || ROLE_TABS.viewer;
      // Hide tabs not allowed
      document.querySelectorAll('#app-tabs a[data-tab]').forEach(a => {
        a.style.display = allowedTabs.includes(a.dataset.tab) ? '' : 'none';
      });
      // Read-only banner si viewer
      if (user.role === 'viewer') {
        const banner = document.createElement('div');
        banner.className = 'readonly-banner';
        banner.textContent = '👁 Modo solo lectura — tu rol no permite editar';
        document.querySelector('.app-main').insertBefore(banner, document.querySelector('.app-h1'));
        // Disable all inputs/buttons after each render (via mutation observer or post-render)
        document.body.classList.add('is-viewer');
      }
    }

    function ensureCanAccess () {
      const { top } = activeRoute();
      const allowed = ROLE_TABS[currentUser?.role || 'viewer'];
      if (!allowed.includes(top)) {
        // Redirect to first allowed tab
        const fallback = allowed[0];
        if (fallback === 'leads') window.location.href = '/admin/dashboard';
        else window.location.hash = '#' + (ROUTES[fallback]?.subs ? fallback + '/' + ROUTES[fallback].defaultSub : fallback);
      }
    }

    // ============================================================
    // Boot
    // ============================================================
    async function checkAuth () {
      try {
        const res = await fetch('/api/admin/me', { credentials: 'same-origin' });
        if (!res.ok) { window.location.replace('/admin/login'); return null; }
        return await res.json();
      } catch { window.location.replace('/admin/login'); return null; }
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      try { await api('/api/admin/logout', { method: 'POST' }); } catch {}
      window.location.replace('/admin/login');
    });

    (async function () {
      const me = await checkAuth();
      if (!me) return;
      document.getElementById('user-email').textContent = me.email + ' · ' + (ROLE_LABELS_USR[me.role] || me.role);
      applyRoleUI(me);
      if (!window.location.hash) {
        // Default tab = primera permitida del rol
        const allowed = ROLE_TABS[me.role] || ROLE_TABS.viewer;
        const firstNonLeads = allowed.find(t => t !== 'leads');
        if (firstNonLeads === 'contenido') window.location.hash = '#contenido/general';
        else if (firstNonLeads === 'configuracion') window.location.hash = '#configuracion/analytics';
        else if (firstNonLeads) window.location.hash = '#' + firstNonLeads;
        else window.location.href = '/admin/dashboard';
      }
      ensureCanAccess();
      renderActive();
    })();
  </script>
</body>
</html>
