name: preview

# Stub workflow — se activa cuando se configure el deploy target en Fase C.
# Hoy: documenta el flujo esperado, no ejecuta deploy.
#
# Para activar:
# 1. Crear proyecto en Cloudflare Pages (o Railway).
# 2. Agregar secrets:
#    - CLOUDFLARE_API_TOKEN
#    - CLOUDFLARE_ACCOUNT_ID
# 3. Quitar el `if: false` de los steps de deploy.

on:
  pull_request:
    branches: [main]
    paths:
      - 'template-next/**'
      - '.github/workflows/preview.yml'

jobs:
  preview:
    name: deploy preview
    runs-on: ubuntu-latest
    if: hashFiles('template-next/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: template-next/pnpm-lock.yaml
      - name: install
        working-directory: template-next
        run: pnpm install --frozen-lockfile
      - name: build
        working-directory: template-next
        run: pnpm build
      - name: deploy to Cloudflare Pages preview
        if: false   # ← quitar cuando los secrets estén configurados
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: landing-slowcraft-preview
          directory: template-next/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: comment preview URL on PR
        if: false   # ← quitar cuando deploy esté activo
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview deployed: <PREVIEW_URL>`
            })
