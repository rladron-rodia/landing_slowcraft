<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Slowcraft</title>
  <meta name="description" content="La página que buscás no existe. Volvé al home de Slowcraft.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://slowcraft.ai/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3CclipPath id='c'%3E%3Cpath d='M12 0h12v24H12z'/%3E%3C/clipPath%3E%3C/defs%3E%3Ccircle cx='12' cy='12' r='10' fill='none' stroke='%230F0F0E' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='10' fill='%230F0F0E' clip-path='url(%23c)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;1,400&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --tinta: #0F0F0E;
      --crema: #F5F1EA;
      --salvia: #3A4F41;
      --cobre: #A8593D;
      --piedra: #7A7570;
      --piedra-light: #DDD8D0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--crema);
      color: var(--tinta);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 560px;
      text-align: center;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 64px;
      text-decoration: none;
      color: var(--tinta);
    }
    .logo-symbol {
      width: 24px;
      height: 24px;
      border: 1.5px solid var(--tinta);
      border-radius: 50%;
      position: relative;
      overflow: hidden;
    }
    .logo-symbol::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      background: var(--tinta);
    }
    .logo-text {
      font-family: 'Newsreader', serif;
      font-size: 24px;
      font-weight: 400;
    }
    .eyebrow {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--cobre);
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Newsreader', serif;
      font-size: clamp(56px, 12vw, 96px);
      line-height: 1;
      letter-spacing: -3px;
      font-weight: 400;
      margin-bottom: 24px;
    }
    h1 em { font-style: italic; color: var(--salvia); }
    p {
      font-size: 18px;
      line-height: 1.6;
      color: var(--piedra);
      max-width: 440px;
      margin: 0 auto 40px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 32px;
      background: var(--tinta);
      color: var(--crema);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.3px;
      border-radius: 2px;
      transition: background 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cta:hover { background: var(--salvia); transform: translateY(-2px); }
    .cta::after { content: '→'; transition: transform 0.3s; }
    .cta:hover::after { transform: translateX(6px); }
    .meta {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--piedra-light);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--piedra);
      text-transform: uppercase;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a href="/" class="logo" aria-label="Slowcraft">
      <span class="logo-symbol" aria-hidden="true"></span>
      <span class="logo-text">Slowcraft</span>
    </a>
    <div class="eyebrow">Error 404</div>
    <h1>Esta página <em>no existe.</em></h1>
    <p>El link que seguiste está roto o la página fue removida. Volvé al inicio para seguir explorando.</p>
    <a href="/landing_slowcraft/" class="cta">Volver al home</a>
    <div class="meta">Slowcraft · Estrategia IA deliberadamente diseñada</div>
  </main>
</body>
</html>
